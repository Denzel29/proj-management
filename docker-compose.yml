# Forge on the VPS: the app plus its own PostgreSQL, next to the existing Caddy.
#
# Caddy (from the other stack, network "deploy_default") reaches the app by the alias
# "forge-app" on port 3000. The database is only reachable from inside this stack.
#
#   docker compose up -d --build     start / update
#   docker compose logs -f forge     watch the app
name: forge

services:
  forge:
    build: .
    image: forge-app:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      default: {}
      proxy:
        aliases: [forge-app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging

volumes:
  uploads:
  pgdata:

networks:
  default: {}
  proxy:
    external: true
    name: deploy_default
