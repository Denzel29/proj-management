<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge</title>
  <meta name="theme-color" content="#0f9d92">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f9d92'/%3E%3Cpath d='M9 22V10h10M9 16h8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try { var t = localStorage.getItem('forge.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="drawer-root"></div>
  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Forge needs JavaScript to run.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
